# 生产环境 nginx 配置：
# 1. 托管 Vite 构建产物
# 2. /api 反向代理到 compose 网络中的 backend 服务
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
